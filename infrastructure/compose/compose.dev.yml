services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kitchenflow_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only-change-me}
      POSTGRES_DB: ${POSTGRES_KITCHENFLOW_DB:-kitchenflow}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kitchenflow-postgres:/var/lib/postgresql
      - ../keycloak/init-keycloak-db.sql:/docker-entrypoint-initdb.d/init-keycloak-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-development-only-change-me}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_KEYCLOAK_DB:-keycloak}
      KC_DB_USERNAME: ${POSTGRES_USER:-kitchenflow_dev}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-development-only-change-me}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../keycloak/kitchenflow-realm.json:/opt/keycloak/data/import/kitchenflow-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  kitchenflow-postgres:
