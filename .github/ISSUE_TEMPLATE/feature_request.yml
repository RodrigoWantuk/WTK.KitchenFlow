name: Feature request
description: Propose a product, engineering, documentation, or operational improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing implementation details. Technical decisions may require an Architecture Decision Record.

  - type: textarea
    id: problem
    attributes:
      label: User or engineering problem
      description: Who experiences the problem, in what context, and what outcome is currently difficult?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the observable result without assuming a specific implementation.
    validations:
      required: true

  - type: textarea
    id: scenarios
    attributes:
      label: Key scenarios and acceptance criteria
      description: List representative scenarios, constraints, edge cases, and measurable acceptance criteria.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Product discovery
        - Frontend
        - Backend
        - AI workflows
        - Data and contracts
        - Infrastructure and operations
        - Security and privacy
        - Testing and quality
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints and risks
      description: Include localization, accessibility, food safety, privacy, cost, deployment, compatibility, or migration concerns.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or alternative approaches already considered.

  - type: checkboxes
    id: architecture
    attributes:
      label: Architecture review
      options:
        - label: This proposal may establish or change a durable architectural decision.
        - label: This proposal changes an API, schema, prompt contract, data model, or deployment contract.
