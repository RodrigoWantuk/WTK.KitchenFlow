name: Bug report
description: Report incorrect, unsafe, inaccessible, or unexpected behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include credentials, private household data, allergy records, or complete AI transcripts.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the problem and its user impact.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide minimal, privacy-safe steps to reproduce the problem.
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true

  - type: dropdown
    id: impact
    attributes:
      label: Impact area
      options:
        - Food safety or allergy handling
        - Security or household data isolation
        - Data loss or corruption
        - AI response or validation
        - Pantry or shopping
        - Meal planning or recipe
        - Guided cooking
        - Localization
        - Accessibility
        - Performance or availability
        - Other
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, device, deployment environment, branch, or version when known.

  - type: textarea
    id: diagnostics
    attributes:
      label: Privacy-safe diagnostics
      description: Add correlation identifiers, sanitized logs, screenshots, or error messages. Remove personal data and secrets.

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: I removed credentials, personal data, allergy details, and private AI content from this report.
          required: true
