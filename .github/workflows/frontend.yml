name: Frontend

on:
  push:
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: apps/frontend

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: apps/frontend/yarn.lock
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Typecheck
        run: yarn typecheck
      - name: Lint
        run: yarn lint
      - name: Format check
        run: yarn format:check
      - name: Test
        run: yarn test
      - name: TypeScript-only source guard
        run: yarn guard:ts-only
      - name: Production isolation (static)
        run: yarn guard:production-isolation
      - name: Build prototype
        run: yarn build:prototype
      - name: Build production
        run: yarn build:production
      - name: Dependency audit (allowlist-aware)
        run: yarn audit:policy
